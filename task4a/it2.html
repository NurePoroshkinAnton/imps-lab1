<script>
  // Обробник шукає назву товару в межах картки, щоб у кошику було видно, ЯКИЙ товар додано.
  (function () {
    var items = [];
    var counters = document.querySelectorAll('._e5kr9i');
    document.querySelectorAll('._pbrriw').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var card = btn.closest('._zk04fq');
        items.push(card.querySelector('._onvjkn').textContent);
        counters[0].textContent = items.length;
        counters[1].textContent = items.join(', ');
      });
    });
  })();
</script>
