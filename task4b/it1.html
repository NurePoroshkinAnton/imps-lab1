<script>
  // Обробник шукає назву товару в межах картки, щоб у кошику було видно, ЯКИЙ товар додано.
  (function () {
    var items = [];
    var counters = document.querySelectorAll('._hwiom1');
    document.querySelectorAll('._yqalnm').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var card = btn.closest('._d122c7');
        items.push(card.querySelector('._c7pq24').textContent);
        counters[0].textContent = items.length;
        counters[1].textContent = items.join(', ');
      });
    });
  })();
</script>
